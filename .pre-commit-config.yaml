repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lock
        entry: uv lock --check
        language: system
        files: ^(\.python-version|pyproject\.toml|tools/governance/pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy and native stubtest
        entry: make typecheck
        language: system
        files: ^(pyproject\.toml|Makefile|tools/typing/.*|src/.*\.pyi?|tests/.*\.pyi?|tools/governance/src/.*\.pyi?)$
        pass_filenames: false

      - id: governance
        name: check clarity, dependency restrictions, artifacts and links
        entry: make governance-check
        language: system
        always_run: true
        pass_filenames: false

      - id: ci-secret-scan
        name: scan secrets and private keys
        entry: uv run --frozen alpha-governance-ci scan-secrets
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run --frozen check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run --frozen check-toml
        language: system
        types: [toml]

      - id: check-added-large-files
        name: check added large files
        entry: uv run --frozen check-added-large-files --maxkb=500
        language: system
        types: [file]
