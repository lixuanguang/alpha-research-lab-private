repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lock
        entry: uv lock --check
        language: system
        files: ^(\.python-version|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy --strict src tests
        language: system
        files: ^(pyproject\.toml|src/.*\.py|tests/.*\.py)$
        pass_filenames: false

      - id: ownership-governance
        name: check ownership governance
        entry: uv run --frozen python -m alpha_research.ownership_governance
        language: system
        files: ^(CODEOWNERS|docs/governance/domain-ownership\.(md|toml)|src/alpha_research/ownership_governance\.py|tests/engineering/test_ownership_governance\.py)$
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run --frozen check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run --frozen check-toml
        language: system
        types: [toml]

      - id: check-added-large-files
        name: check added large files
        entry: uv run --frozen check-added-large-files --maxkb=500
        language: system
