repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lock
        entry: uv lock --check
        language: system
        files: ^(\.python-version|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy --strict src tests tools/governance/src
        language: system
        files: ^(pyproject\.toml|src/.*\.py|tests/.*\.py|tools/governance/src/.*\.py)$
        pass_filenames: false

      - id: engineering-standards
        name: check language and static quality standards
        entry: uv run --frozen alpha-governance-engineering-standards
        language: system
        files: ^(pyproject\.toml|uv\.lock|docs/(architecture/engineering-(standards\.(md|toml)|tool-dependencies\.toml)|coding_standards/.*\.md)|src/.*\.(py|pyi)|tests/.*\.py|tools/governance/src/.*\.py)$
        pass_filenames: false

      - id: dependency-admission
        name: check dependency admission and immutable lock surfaces
        entry: uv run --frozen alpha-governance-dependencies
        language: system
        files: ^(\.github/workflows/.*\.yml|\.pre-commit-config\.yaml|MODULE\.bazel\.lock|Makefile|flake\.lock|pyproject\.toml|requirements\.bazel\.txt|uv\.lock|docs/architecture/.*dependencies\.toml|docs/architecture/dependency-admission\.toml|src/.*\.py|tools/governance/.*\.py|tests/engineering/test_dependency_admission\.py)$
        pass_filenames: false

      - id: artifact-supply-chain
        name: check SBOM, provenance, signing, publication, and consumer policy
        entry: uv run --frozen alpha-governance-artifacts
        language: system
        files: ^(\.github/workflows/.*\.yml|\.pre-commit-config\.yaml|MODULE\.bazel\.lock|Makefile|flake\.(lock|nix)|requirements\.bazel\.txt|uv\.lock|docs/architecture/(artifact-supply-chain|dependency-admission)\.toml|tools/governance/src/alpha_research_governance/artifact_supply_chain/.*\.py|tests/engineering/test_artifact_supply_chain\.py)$
        pass_filenames: false

      - id: ci-secret-scan
        name: check committed text for secrets
        entry: uv run --frozen alpha-governance-ci scan-secrets
        language: system
        types: [text]

      - id: ci-policy
        name: check fast and full CI policy
        entry: uv run --frozen alpha-governance-ci
        language: system
        files: ^(\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|BUILD\.bazel|MODULE\.bazel(\.lock)?|Makefile|uv\.lock|docs/architecture/(artifact-supply-chain|ci-policy|ci-tool-dependencies|dependency-admission)\.toml|tests/build/fixtures/proto/.*|tools/governance/src/alpha_research_governance/ci_policy/.*\.py|tests/engineering/test_ci_(policy|runner)\.py)$
        pass_filenames: false

      - id: remote-execution-policy
        name: check remote execution, sharding, flake, and fallback policy
        entry: uv run --frozen alpha-governance-remote-execution
        language: system
        files: ^(\.bazelrc|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|Makefile|docs/(architecture/(build-tool-dependencies\.toml|decisions/0009-remote-execution-service\.md|remote-execution\.(md|toml))|governance/(change-risk-policy\.toml|domain-ownership\.toml|evidence/examples/b06-r2-partial/.*))|src/alpha_research/remote_execution/[a-z_]+\.py|tools/governance/src/alpha_research_governance/remote_execution/[a-z_]+\.py|tests/engineering/(test_remote_execution|test_root_commands)\.py)$
        pass_filenames: false

      - id: architecture-governance
        name: check architecture governance
        entry: uv run --frozen alpha-governance-architecture
        language: system
        files: ^(docs/.*\.md|src/alpha_research/architecture_governance\.py|tools/governance/src/alpha_research_governance/architecture_governance\.py|tests/engineering/test_architecture_governance\.py|Makefile|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: ownership-governance
        name: check ownership governance
        entry: uv run --frozen alpha-governance-ownership
        language: system
        always_run: true
        pass_filenames: false

      - id: change-risk-policy
        name: check change-risk policy
        entry: uv run --frozen alpha-governance-change-risk
        language: system
        files: ^(docs/README\.md|docs/governance/change-risk-(classification\.md|policy\.toml)|src/alpha_research/change_risk/[a-z_]+\.py|tools/governance/src/alpha_research_governance/change_risk/[a-z_]+\.py|tests/engineering/test_change_risk\.py|Makefile|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: evidence-governance
        name: check merge-request and evidence governance
        entry: uv run --frozen alpha-governance-evidence
        language: system
        files: ^(\.github/pull_request_template\.md|docs/README\.md|docs/governance/(change-risk-policy\.toml|merge-evidence(-policy\.toml|\.md)|evidence/examples/.*)|src/alpha_research/evidence/[a-z_]+\.py|tools/governance/src/alpha_research_governance/evidence/[a-z_]+\.py|tests/engineering/test_evidence_governance\.py|Makefile|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: repository-topology
        name: check governed repository topology
        entry: uv run --frozen alpha-governance-topology
        language: system
        always_run: true
        pass_filenames: false

      - id: inventory-governance
        name: check governed resource inventory
        entry: uv run --frozen alpha-governance-inventory
        language: system
        files: ^(docs/README\.md|docs/architecture/(contracts\.md|repository-topology\.(md|toml))|docs/governance/(domain-ownership\.toml|resource-inventory\.(md|toml))|docs/roadmap/README\.md|src/alpha_research/inventory/[a-z_]+\.py|tools/governance/src/alpha_research_governance/inventory/[a-z_]+\.py|tests/engineering/(test_inventory_governance|test_repository_topology|test_root_commands)\.py|Makefile|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: security-control-map
        name: check threat and regulatory control map
        entry: uv run --frozen alpha-governance-security
        language: system
        files: ^(docs/README\.md|docs/governance/(domain-ownership\.toml|security-control-map\.toml|threat-model\.md|evidence/examples/a07-r2-partial/.*)|docs/roadmap/README\.md|src/alpha_research/security_controls/[a-z_]+\.py|tools/governance/src/alpha_research_governance/security_controls/[a-z_]+\.py|tests/engineering/test_security_controls\.py|tests/engineering/test_root_commands\.py|Makefile|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: program-governance
        name: check program dependency and KPI governance
        entry: uv run --frozen alpha-governance-program
        language: system
        files: ^(docs/README\.md|docs/architecture/repository-topology\.(md|toml)|docs/governance/(program-(governance\.(md|toml)|status\.md)|workflow\.md|resource-inventory\.(md|toml)|evidence/examples/a08-r2-partial/.*)|docs/roadmap/(README|research-program)\.md|src/alpha_research/program_governance/[a-z_]+\.py|tools/governance/src/alpha_research_governance/program_governance/[a-z_]+\.py|tests/engineering/(test_program_governance|test_inventory_governance|test_repository_topology|test_root_commands)\.py|Makefile|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run --frozen check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run --frozen check-toml
        language: system
        types: [toml]

      - id: check-added-large-files
        name: check added large files
        entry: uv run --frozen check-added-large-files --maxkb=500
        language: system
