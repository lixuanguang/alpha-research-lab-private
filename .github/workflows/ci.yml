name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Bootstrap package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Install pinned Python
        run: uv python install

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check src tests

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests

      - name: Check types
        run: uv run --frozen mypy --strict src tests

      - name: Check security
        run: uv run --frozen bandit -q -c pyproject.toml -r src

      - name: Test
        run: uv run --frozen pytest -q

      - name: Build package
        run: uv build --no-sources
