name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    env:
      ALPHA_REQUIRE_DUCKDB: "1"
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
          pip install duckdb

      - name: Verify duckdb availability
        run: python -c "import duckdb; print(f'duckdb {duckdb.__version__}')"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Security check (bandit)
        run: bandit -q -c pyproject.toml -r libs/core apps

      - name: Type check (mypy)
        run: mypy libs/ apps/ --strict

      - name: Test (pytest)
        run: pytest tests/ -v --cov=alpha_core --cov-report=term-missing

  research-smoke:
    name: Research CLI Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPHA_REQUIRE_DUCKDB: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
          pip install duckdb

      - name: Run research smoke tests
        run: >
          pytest -m smoke
          tests/integration/test_research_pipeline_e2e.py
          -v --tb=short -x
          --basetemp=/tmp/research-smoke-run

      - name: Upload diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-smoke-diagnostics-${{ github.run_id }}
          path: /tmp/research-smoke-run/
          retention-days: 3
