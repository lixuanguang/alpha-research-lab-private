# ──────────────────────────────────────────────────────────────────────────────
# Alpha Research Lab — CI Pipeline  (Week-1 minimal)
#
# Python:  ruff lint + ruff format check + pytest
# Rust:    cargo fmt check + clippy + tests
# Target:  < 3 minutes on ubuntu-latest
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"

jobs:
  # ── Python ──────────────────────────────────────────────────────────────────
  python:
    name: "Python · lint + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: uv run ruff check python/ scripts/

      - name: Format check (ruff format)
        run: uv run ruff format --check python/ scripts/

      - name: Tests (pytest)
        run: uv run pytest python/tests/ -v --tb=short

  # ── Rust ────────────────────────────────────────────────────────────────────
  rust:
    name: "Rust · fmt + clippy + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lab/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('lab/Cargo.lock', 'lab/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check (cargo fmt)
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml -- -D warnings

      - name: Tests
        run: cargo test --manifest-path Cargo.toml
