name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    name: Affected-target fast lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python
        run: uv python install

      - name: Install locked environment
        run: uv sync --frozen

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Install pinned Bazel launcher
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Run affected owners and reverse dependencies
        run: >-
          make ci-fast
          CI_BASE_REF="${{ github.event.pull_request.base.sha }}"
          CI_HEAD_REF="${{ github.event.pull_request.head.sha }}"
          CI_RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}-fast"
          CI_ENVIRONMENT="github_pr_head"
          CI_EVIDENCE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  merged-result:
    name: Authoritative merged-result full lane
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python
        run: uv python install

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --frozen

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Audit admitted Python dependencies
        run: make dependency-audit

      - name: Install pinned Bazel launcher
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Verify pull-request merged-result identity
        if: github.event_name == 'pull_request'
        run: >-
          uv run --frozen alpha-governance-ci verify-merged-result
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --revision "$GITHUB_SHA"

      - name: Lint pull-request body
        if: github.event_name == 'pull_request'
        run: uv run --frozen alpha-governance-evidence --github-event "$GITHUB_EVENT_PATH"

      - name: Run authoritative full graph
        run: >-
          make ci-full
          CI_BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          CI_RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}-full"
          CI_ENVIRONMENT="github_merged_result"
          CI_EVIDENCE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  remote-execution:
    name: Remote execution shard ${{ matrix.shard }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.REMOTE_EXECUTION_ENABLED == 'true'
    needs: merged-result
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python and locked environment
        run: |
          uv python install
          uv sync --frozen

      - name: Install pinned Bazel launcher
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: "1.29.0"

      - name: Validate repository-owned remote policy
        run: make remote-execution-policy-check

      - name: Populate authenticated remote build cache
        run: make remote-build REMOTE_CONTEXT=github_main_push

      - name: Run deterministic remote test shard
        run: >-
          make remote-test
          REMOTE_CONTEXT=github_main_push
          REMOTE_SHARD_INDEX="${{ matrix.shard }}"

      - name: Run diagnostic quarantine repeats
        if: matrix.shard == 0
        run: make remote-quarantine REMOTE_CONTEXT=github_main_push
