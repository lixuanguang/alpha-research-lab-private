name: CI

# CI runs once per merge candidate, not per commit: only when a pull request into
# main is labeled `ready-to-merge`. Commits to other branches and the post-merge
# push to main run nothing. After new commits, remove and re-add the label.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  source-validation:
    name: Source validation
    if: github.event.label.name == 'ready-to-merge'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python
        run: uv python install

      - name: Install locked environment
        run: uv sync --frozen

      - name: Verify supported Python runtime
        run: |
          uv run --frozen --no-editable python - <<'PY'
          """Verify the pinned interpreter and supported platform."""

          # standard library imports
          import platform
          import sys
          import sysconfig
          from pathlib import Path

          print(sys.version, platform.platform(), platform.machine())
          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == Path(".python-version").read_text().strip()
          assert sys._is_gil_enabled() and not sysconfig.get_config_var("Py_GIL_DISABLED")
          assert platform.machine() == "x86_64"
          PY

      - name: Run source validation
        run: make source-check

  merged-result:
    name: Authoritative merged-result full lane
    needs: [source-validation, macos-wheel-smoke]
    if: always() && github.event.label.name == 'ready-to-merge'
    runs-on: ubuntu-latest

    steps:
      - name: Require source and platform smoke jobs
        if: needs.source-validation.result != 'success' || needs.macos-wheel-smoke.result != 'success'
        run: |
          echo "source validation or macOS wheel smoke failed" >&2
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python
        run: uv python install

      - name: Install locked environment
        run: uv sync --frozen

      - name: Verify supported Python runtime
        run: |
          uv run --frozen --no-editable python - <<'PY'
          """Verify the pinned interpreter and supported platform."""

          # standard library imports
          import platform
          import sys
          import sysconfig
          from pathlib import Path

          print(sys.version, platform.platform(), platform.machine())
          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == Path(".python-version").read_text().strip()
          assert sys._is_gil_enabled() and not sysconfig.get_config_var("Py_GIL_DISABLED")
          assert platform.machine() == "x86_64"
          PY

      - name: Verify pull-request merged-result identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}")"
          expected_head="$(git rev-parse --verify --end-of-options "${HEAD_SHA}^{commit}")"
          merged_commit="$(git rev-parse --verify --end-of-options "${MERGED_SHA}^{commit}")"
          actual_commit="$(git rev-parse --verify HEAD)"
          if [[ "$actual_commit" != "$merged_commit" ]]; then
            echo "checked-out commit does not match the merged result" >&2
            exit 1
          fi
          read -r -a parents <<< "$(git rev-list --parents -n 1 "$merged_commit" --)"
          if [[ "${#parents[@]}" -ne 3 ]]; then
            echo "merged result must have exactly two parents" >&2
            exit 1
          fi
          if [[ "${parents[1]}" != "$expected_base" || "${parents[2]}" != "$expected_head" ]]; then
            echo "merged result parents do not match the pull-request base and head" >&2
            exit 1
          fi

      - name: Build and install wheel smoke
        run: make wheel-smoke

  macos-wheel-smoke:
    name: macOS wheel smoke
    needs: source-validation
    runs-on: macos-14

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python
        run: uv python install

      - name: Verify supported Python runtime
        run: |
          uv run --frozen --no-editable python - <<'PY'
          """Verify the pinned interpreter and supported platform."""

          # standard library imports
          import platform
          import sys
          import sysconfig
          from pathlib import Path

          print(sys.version, platform.platform(), platform.machine())
          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == Path(".python-version").read_text().strip()
          assert sys._is_gil_enabled() and not sysconfig.get_config_var("Py_GIL_DISABLED")
          assert platform.machine() == "arm64"
          PY

      - name: Build and install wheel smoke
        run: make wheel-smoke
