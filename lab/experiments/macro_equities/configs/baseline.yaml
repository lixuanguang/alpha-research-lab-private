# ──────────────────────────────────────────────────────────────────────────────
# Baseline macro-equities experiment configuration
# ──────────────────────────────────────────────────────────────────────────────

# ── Required fields ──────────────────────────────────────────────────────────
exp: macro_regimes
strategy: macro_equities.baseline

universe:
  - SPY
  - EFA
  - EEM
  - TLT

start_date: "2016-01-01"
end_date: "2024-12-31"
rebalance: weekly
initial_capital: 1000000

# ── Signal ───────────────────────────────────────────────────────────────────
signal:
  name: cs_mom
  lookback: 60
  long_only: true

# ── Regime ───────────────────────────────────────────────────────────────────
regime:
  name: ma_crossover
  fast: 20
  slow: 60
  risk_off_scale: 0.3

# ── Costs ────────────────────────────────────────────────────────────────────
costs:
  bps: 5

# ── Strategy-specific hyper-parameters ───────────────────────────────────────
params:
  momentum_lookback: 60
  momentum_skip: 21
  vol_window: 60
  sma_window: 200
  top_n: 4
  signal_weights:
    momentum: 0.4
    inverse_vol: 0.3
    trend: 0.3
