# ──────────────────────────────────────────────────────────────────────────────
# Alpha Research Lab — Python project metadata (PEP 621)
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-research-lab"
version = "0.1.0"
description = "Private alpha-research lab — systematic strategies, backtesting, and evaluation toolkit."
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=0.20",
    "pyarrow>=14",
    "pyyaml>=6",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.3",
    "mypy>=1.8",
    "ipython>=8",
    "jupyter>=1",
    "pre-commit>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["python/lab"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["python"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]
ignore = [
    "E501",               # line length handled by formatter
    "RUF001", "RUF002", "RUF003",  # allow unicode math symbols in docstrings / comments
]

[tool.ruff.lint.isort]
known-first-party = ["lab"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra -q"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
