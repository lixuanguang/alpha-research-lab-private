schema_version = 1
roadmap_package = "B04"
operating_track = "solo_bootstrap"
package_status = "partial"
accountable_owner_role = "platform"
risk_class = "R2"
successor_package = "B05"
validation_workload_iterations = 10000
validation_workload_budget_ms = 1000
applicable_gate_ids = [
  "QG01",
  "QG02",
  "QG03",
  "QG04",
  "QG05",
  "QG06",
  "QG09",
  "QG10",
  "QG11",
  "QG12",
  "QG13",
  "QG14",
]
source_roots = [
  "src/alpha_research",
  "tests",
  "tools/governance/src/alpha_research_governance",
  "tools/typing/stubs",
]
local_evidence_manifest_path = "docs/governance/evidence/examples/b04-r2-partial/manifest.toml"
local_evidence_commit_sha = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
open_finding_ids = ["B04-F01", "B04-F02", "B04-F03"]

[suppressions]
required_metadata_order = ["owner", "rationale", "expires"]
maximum_lifetime_days = 180
minimum_rationale_characters = 12

[generated_code]
source_roots = []
banner_prefix = "@generated"
required_metadata = ["generator", "generator_version", "input_sha256"]
manual_edits_allowed = false

[numerical]
global_epsilon_allowed = false
non_finite_default = "reject"
exact_arithmetic_types = ["integer", "decimal"]
floating_comparison_requires = ["absolute_tolerance", "relative_tolerance", "scale_rationale"]
fast_math_requires_separate_review = true

[property_testing]
tool = "hypothesis"
version = "6.167.1"
maximum_examples = 50
derandomize = true
database = "none"
state_machine_required_for_stateful_contracts = true

[baselines]
coverage_statement_percent = 81
coverage_branch_measurement = true
coverage_scope = ["alpha_research", "alpha_research_governance"]
mutation_cases = 12
mutation_cases_rejected = 12
measurement_date = "2026-09-02"

[[tools]]
tool_id = "bandit"
version = "1.9.4"
roles = ["security_static_analysis"]

[[tools]]
tool_id = "coverage"
version = "7.15.4"
roles = ["coverage_baseline"]

[[tools]]
tool_id = "hypothesis"
version = "6.167.1"
roles = ["property_testing", "state_machine_testing"]

[[tools]]
tool_id = "mypy"
version = "2.3.1"
roles = ["strict_type_checking"]

[[tools]]
tool_id = "pytest"
version = "9.1.1"
roles = ["test_execution", "warnings_as_errors"]

[[tools]]
tool_id = "pytest-cov"
version = "7.1.0"
roles = ["coverage_baseline"]

[[tools]]
tool_id = "ruff"
version = "0.16.5"
roles = ["formatting", "linting"]

[[languages]]
language_id = "python"
admission_status = "admitted"
version = "3.12.14"
source_extensions = [".py", ".pyi"]
warnings_policy = "pytest warnings are errors; Ruff and strict mypy findings are blocking"
sanitizers = []

[[languages]]
language_id = "c_cpp"
admission_status = "dormant"
version = "not_admitted"
source_extensions = [".c", ".cc", ".cpp", ".h", ".hpp"]
warnings_policy = "compiler warnings are errors for project code"
sanitizers = ["address", "undefined_behavior", "thread_for_shared_memory"]

[[languages]]
language_id = "rust"
admission_status = "dormant"
version = "not_admitted"
source_extensions = [".rs"]
warnings_policy = "clippy warnings are denied"
sanitizers = ["miri_or_applicable_sanitizer_for_unsafe_or_low_level_code"]

[[api_surfaces]]
surface = "alpha_research"
stability = "compatibility"
breaking_change_policy = "versioned migration, deprecation window, compatibility test, and rollback"

[[api_surfaces]]
surface = "alpha_research_governance"
stability = "repository_internal"
breaking_change_policy = "same-change consumer update plus retained rollback"

[[findings]]
finding_id = "B04-F01"
owner_role = "domain_architecture"
unavailable_evidence = "Independent domain review and commit-bound Platform Code Owner approval are unavailable during solo bootstrap."
closure_condition = "Named reviewers resolve findings and approve the exact standards, checker, dependency record, baselines, and evidence at the reviewed commit."

[[findings]]
finding_id = "B04-F02"
owner_role = "platform_ci"
unavailable_evidence = "Protected merged-result Linux execution with retained representative-defect, property, state-machine, coverage, and mutation evidence is unavailable from this checkout."
closure_condition = "Protected CI runs the exact reviewed merged result on x86_64-linux and retains passing standards, property/state-machine, coverage, and all twelve blocking-mutation results."

[[findings]]
finding_id = "B04-F03"
owner_role = "security"
unavailable_evidence = "Qualified final source, license, vulnerability, exploitability, maintenance, and transitive dependency admission for Hypothesis is B07-owned."
closure_condition = "B07 admits or replaces Hypothesis and sortedcontainers without weakening property/state-machine coverage, determinism, the Bazel graph, or rollback."
