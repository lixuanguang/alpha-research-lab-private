schema_version = 1
roadmap_package = "B05"
parent_package = "B05"
operating_track = "solo_bootstrap"
package_status = "partial"
accountable_owner_role = "platform"
risk_class = "R2"
applicable_gate_ids = [
  "QG01",
  "QG02",
  "QG03",
  "QG04",
  "QG05",
  "QG06",
  "QG09",
  "QG10",
  "QG11",
  "QG12",
  "QG13",
  "QG14",
]
successor_package = "B06"
selection_strategy = "bazel_owner_reverse_dependencies"
unknown_path_behavior = "full_lane"
full_lane_authoritative = true
require_merged_result_on_pull_request = true
selection_workload_budget_ms = 1000
maximum_changed_files = 1000
fast_lane_target_status = "pending_owner_approval"
secret_scanner_executable = "detect-private-key"
secret_scanner_version = "pre-commit-hooks==6.0.0"
secret_scan_maximum_file_bytes = 1000000
secret_pattern_ids = [
  "assigned_credential",
  "aws_access_key",
  "github_token",
  "private_key",
  "slack_token",
  "stripe_live_key",
]
generated_artifact_prefixes = [
  "bazel-bin/",
  "bazel-out/",
  "bazel-testlogs/",
  "build/",
  "dist/",
]
foundational_paths = [
  ".bazelrc",
  ".bazelversion",
  ".github/workflows",
  ".pre-commit-config.yaml",
  "BUILD.bazel",
  "MODULE.bazel",
  "MODULE.bazel.lock",
  "Makefile",
  "docs/architecture/ci-policy.toml",
  "docs/architecture/ci-tool-dependencies.toml",
  "requirements.bazel.txt",
  "tools/build",
  "tools/governance",
  "uv.lock",
]
schema_module_roots = ["tests/build/fixtures/proto"]
local_evidence_manifest_path = "docs/governance/evidence/examples/b05-r2-partial/manifest.toml"
local_evidence_commit_sha = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
open_finding_ids = ["B05-F01", "B05-F02", "B05-F03"]

[[lanes]]
lane_id = "fast"
contexts = ["local_diff", "pull_request_head"]
pre_commit_scope = "changed"
build_scope = "affected_reverse_dependencies"
test_scope = "affected_reverse_dependencies"
authoritative = false

[[lanes]]
lane_id = "full"
contexts = ["local", "main_push", "pull_request_merge"]
pre_commit_scope = "all"
build_scope = "complete_graph"
test_scope = "complete_graph"
authoritative = true

[[findings]]
finding_id = "B05-F01"
owner_role = "domain_architecture"
unavailable_evidence = "Independent domain review and commit-bound Platform Code Owner, SRE, and Security approval are unavailable during solo bootstrap."
closure_condition = "Named reviewers resolve findings and approve the exact affected/full policy, scanner, compatibility, evidence-event, rollback, and hosted-lane commit."

[[findings]]
finding_id = "B05-F02"
owner_role = "platform_ci"
unavailable_evidence = "Protected pull-request merged-result execution, retained exact-commit events, representative affected-versus-full comparisons, and an owner-approved median fast-lane target are unavailable from the local checkout."
closure_condition = "Protected CI requires the exact merged-result full lane, retains build/test events, demonstrates affected selection equivalence against the full graph over representative changes, and approves then meets the median fast-lane budget."

[[findings]]
finding_id = "B05-F03"
owner_role = "security"
unavailable_evidence = "Qualified final source, license, vulnerability, exploitability, maintenance, and transitive admission for the secret scanner remains B07-owned."
closure_condition = "B07 admits or replaces pre-commit-hooks detect-private-key without weakening full tracked-source scanning, high-confidence token rules, fail-closed behavior, or rollback."
