schema_version = 1
roadmap_package = "B06"
operating_track = "solo_bootstrap"
package_status = "partial"
accountable_owner_role = "platform"
risk_class = "R2"
applicable_gate_ids = [
  "QG01",
  "QG02",
  "QG03",
  "QG04",
  "QG05",
  "QG06",
  "QG09",
  "QG10",
  "QG11",
  "QG12",
  "QG13",
  "QG14",
]
successor_package = "B07"
local_evidence_manifest_path = "docs/governance/evidence/examples/b06-r2-partial/manifest.toml"
local_evidence_commit_sha = "cccccccccccccccccccccccccccccccccccccccc"
open_finding_ids = ["B06-F01", "B06-F02", "B06-F03"]

[provider]
provider_id = "buildbuddy_cloud"
protocol = "remote_execution_api_v2"
cache_endpoint = "grpcs://remote.buildbuddy.io"
executor_endpoint = "grpcs://remote.buildbuddy.io"
results_url = "https://app.buildbuddy.io"
authentication = "api_key_header"
credential_environment_variable = "BUILDBUDDY_API_KEY"
authentication_header = "x-buildbuddy-api-key"
decision_path = "docs/architecture/decisions/0009-remote-execution-service.md"

[trust]
instance_name = "alpha-research-lab-private/trusted/bazel-9.1.0-python-3.12.14-linux-x86_64-v1"
trusted_contexts = ["github_main_push"]
untrusted_contexts = ["developer", "github_pull_request"]
upload_contexts = ["github_main_push"]
verify_downloads = true
workspace_credential_helpers_permitted = false

[resources]
remote_jobs = 25
local_jobs = 4
local_cpu = 4
local_memory_mb = 4096
remote_retries = 2
remote_retry_max_delay_seconds = 3
remote_timeout_seconds = 60

[sharding]
algorithm = "sha256_seeded_modulo_v1"
seed = "remote-test-sharding-20260902-v1"
shard_count = 2
maximum_targets = 1000

[flakes]
normal_test_attempts = 1
quarantine_repeat_count = 5
maximum_quarantine_days = 14
as_of_date = 2026-09-02
quarantines = []

[local_fallback]
remote_cache_disabled = true
remote_execution_disabled = true
remote_upload_disabled = true
build_targets = [
  "//:docs_bundle",
  "//src/alpha_research:alpha_research",
  "//tests/build/fixtures/sql:build_evidence",
  "//tools/governance/src/alpha_research_governance:all",
]
test_targets = ["//..."]

[[findings]]
finding_id = "B06-F01"
owner_role = "domain_architecture"
unavailable_evidence = "Independent Platform Code Owner, SRE, Security, and domain review of the provider, trust, namespace, retry, sharding, flake, resource, and fallback contract is unavailable during solo bootstrap."
closure_condition = "Named reviewers resolve findings and approve the exact B06 policy, ADR, runner, workflow, tests, fallback, and evidence commit."

[[findings]]
finding_id = "B06-F02"
owner_role = "platform_ci"
unavailable_evidence = "A protected BuildBuddy organization, protected main-push API key, namespace and retention controls, quotas, target-host observations, and retained exact-commit local-versus-remote equivalence evidence are unavailable from the local checkout."
closure_condition = "Platform CI provisions least-privilege protected credentials and quotas, enables the guarded main-push lane, demonstrates complete two-shard/full-suite equivalence with the fixed seed, and retains exact-commit cache-hit, execution, duration, and local-fallback evidence."

[[findings]]
finding_id = "B06-F03"
owner_role = "security"
unavailable_evidence = "Target-service cache poisoning, tenant isolation, credential rotation and revocation, outage fallback, license, vulnerability, exploitability, maintenance, and transitive dependency admission remain unavailable or B07-owned."
closure_condition = "Security and B07 admit or replace the service without weakening authenticated transport, namespace isolation, verified downloads, untrusted-context denial, bounded infrastructure-only retries, strict test results, or remote-disabled fallback, and retain poisoning, rotation, revocation, and outage drills."
