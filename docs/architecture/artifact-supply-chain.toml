schema_version = 2
supported_artifact_kinds = ["binary", "configuration_bundle", "container", "model"]
native_library_markers = [".dll", ".dylib", ".so", ".so."]

[formats]
statement_type = "https://in-toto.io/Statement/v1"
provenance_predicate_type = "https://slsa.dev/provenance/v1"
spdx_version = "SPDX-2.3"

[identity]
builder_id = "https://github.com/lixuanguang/alpha-research-lab-private/.github/workflows/ci.yml@refs/heads/main"
build_type = "https://github.com/lixuanguang/alpha-research-lab-private/blob/main/docs/architecture/artifact-supply-chain.md#build-contract"
source_repository = "git+https://github.com/lixuanguang/alpha-research-lab-private.git"

[signing]
signer_identity = "https://github.com/lixuanguang/alpha-research-lab-private/.github/workflows/ci.yml@refs/heads/main"
oidc_issuer = "https://token.actions.githubusercontent.com"
trusted_context = "github_protected_main"
required_environment = [
  "GITHUB_ACTIONS=true",
  "GITHUB_REF=refs/heads/main",
  "GITHUB_REF_PROTECTED=true",
]
revoked_signer_identities = []

[limits]
maximum_artifact_bytes = 1073741824
maximum_archive_members = 100000

[project]
path = "pyproject.toml"
sha256 = "cc7e5970a89b584635e3cf3ea4a5dd1e5ac6623f4b4ed367b63728abb157ef1e"

[tools.syft]
command = "syft"
version = "1.51.1"

[tools.cosign]
command = "cosign"
version = "3.1.3"

[[locks]]
path = "uv.lock"
sha256 = "4c07ddd8fa583a0aa3f88a5c4f3b320fbd436868d80d3c72f74e7d0f0f005bee"
