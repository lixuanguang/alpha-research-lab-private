[[controls]]
control_id = "A07-C01"
title = "Protected source and independent review"
domain = "source_governance"
owner_role = "platform"
independent_review_roles = ["security"]
objective = "Bind changes, risk classification, evidence, and required approvals to the exact reviewed commit and reject direct or author-only acceptance."
control_functions = ["prevent", "detect"]
implementation_packages = ["A03", "A04", "A05"]
implementation_status = "planned"
test_procedure = "Exercise direct-push, post-approval mutation, missing-owner, classification-downgrade, and insufficient-review cases on protected main."
fail_safe_response = "Block merge and retain the failed exact-commit evidence until required independent review succeeds."
evidence_source_ids = ["A07-EV05"]

[[controls]]
control_id = "A07-C02"
title = "Hermetic provenance and immutable artifact verification"
