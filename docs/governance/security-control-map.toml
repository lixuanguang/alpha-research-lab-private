control_functions = ["prevent", "detect", "respond"]
implementation_packages = ["B07", "B08", "K03"]
implementation_status = "repository_local"
test_procedure = "Attempt dependency substitution, undeclared input, artifact tamper, forged provenance, mutable tag, and revoked-signing-key admission."
fail_safe_response = "Reject the artifact, halt promotion, revoke affected keys, and rebuild from the last trusted source and toolchain."
evidence_source_ids = ["A07-EV06", "A07-EV16"]

[[controls]]
control_id = "A07-C03"
title = "Least privilege, JIT elevation, and dual control"
