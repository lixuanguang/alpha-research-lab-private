security_privilege = "production_or_market_access"
reversibility = "capital_state_reconciliation"
expected_class = "R4"

[[findings]]
finding_id = "A04-F01"
owner_role = "platform_ci"
unavailable_evidence = "PR #5 retains successful exact-commit hosted CI, but the target branch is not protected, so protected-forge evidence remains unavailable."
closure_condition = "The exact reviewed commit passes the change-risk policy job in the protected external forge and retains the result."

[[findings]]
finding_id = "A04-F02"
owner_role = "platform"
unavailable_evidence = "Protected-forge enforcement of classifier output, reviewer groups, and gate selection is unavailable during repository-local implementation."
closure_condition = "Exercise representative R0-R4 changes in the protected forge and prove that a downgrade, a single-approver R4 change, and an R4 hard-control waiver are blocked."

[[findings]]
finding_id = "A04-F03"
owner_role = "security"
unavailable_evidence = "Independent Security, SRE/promotion-control, and Independent Risk review are unavailable during solo bootstrap."
closure_condition = "Named independent reviewers resolve findings and record commit-bound approval of the classifier, R4 controls, rollout mapping, and retention mapping."
