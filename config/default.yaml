project_name: alpha-research-lab
log_level: INFO
# profile: dev  # Uncomment to pin a runtime profile; or pass --profile at the CLI.
#   Valid values: dev | research | ci | paper | live
#   When set, the profile's log_level, dry_run flag, and storage root are
#   applied as authoritative overrides in addition to this file.
feature_flags:
  enable_pmxt_adapter: true
  enable_storage_validation: true
  dry_run: false
storage:
  base_path: data
  bronze_path: bronze
  silver_path: silver
  gold_path: gold
  partition_by:
    - venue
    - date
venues:
  - name: kalshi
    exchange_class: Kalshi
    enabled: true
    api_key_env: ALPHA_KALSHI_API_KEY
    private_key_env: ALPHA_KALSHI_PRIVATE_KEY
    rate_limit_rpm: 120
  - name: kalshidemo
    exchange_class: KalshiDemo
    enabled: true
    api_key_env: ALPHA_KALSHIDEMO_API_KEY
    private_key_env: ALPHA_KALSHIDEMO_PRIVATE_KEY
    rate_limit_rpm: 120
  - name: polymarket
    exchange_class: Polymarket
    enabled: true
    api_key_env: ALPHA_POLYMARKET_API_KEY
    private_key_env: ALPHA_POLYMARKET_PRIVATE_KEY
    rate_limit_rpm: 90000
  - name: limitless
    exchange_class: Limitless
    enabled: true
    api_key_env: ALPHA_LIMITLESS_API_KEY
    private_key_env: ALPHA_LIMITLESS_PRIVATE_KEY
    rate_limit_rpm: 120
  - name: baozi
    exchange_class: Baozi
    enabled: true
    api_key_env: ALPHA_BAOZI_API_KEY
    private_key_env: ALPHA_BAOZI_PRIVATE_KEY
    rate_limit_rpm: 120
  - name: myriad
    exchange_class: Myriad
    enabled: true
    api_key_env: ALPHA_MYRIAD_API_KEY
    private_key_env: ALPHA_MYRIAD_PRIVATE_KEY
    rate_limit_rpm: 120
  - name: probable
    exchange_class: Probable
    enabled: true
    api_key_env: ALPHA_PROBABLE_API_KEY
    private_key_env: ALPHA_PROBABLE_PRIVATE_KEY
    rate_limit_rpm: 120
