# Example dataset build configuration.
#
# Pass this file with:
#   python -m apps.research.main --config config/research/dataset.example.yaml \
#       build-dataset --name pm_gold_jan2026 \
#       --start 2026-01-01T00:00:00Z \
#       --end   2026-01-31T23:59:59Z \
#       --venue polymarket \
#       --event-type trades --event-type ohlcv \
#       --execute
#
# The file is hashed and stored in the run manifest for full reproducibility.
# Adjust individual options on the CLI; this file acts as a shared reference
# base for config hashing (all overrides are captured in the manifest).

research:
  dataset:
    # Default venues to target (overridable via --venue flag).
    venues:
      - polymarket

    # Default event types to include (overridable via --event-type flag).
    event_types:
      - trades
      - ohlcv

    # Quality gate: set to false in dev to skip partition validation.
    require_quality_pass: true

    # Gap detection: set to true to block builds with data gaps > max_gap_hours.
    require_gap_free: false
    max_gap_hours: 24.0

  storage:
    # Default storage root (overridable via --storage-root flag).
    root: data
