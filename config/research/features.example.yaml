# Example feature-build configuration.
#
# Pass this file with:
#   python -m apps.research.main --config config/research/features.example.yaml \
#       build-features \
#       --dataset-id <dataset_id> \
#       --feature-set-version v1 \
#       --lookback-bars 200 \
#       --execute
#
# The file is hashed and stored in the run manifest for full reproducibility.
# Adjust individual options on the CLI; this file acts as a shared reference
# base for config hashing (all overrides are captured in the manifest).

research:
  features:
    # Monotonic version tag for this feature set.
    # Bump whenever feature definitions or lookback change.
    feature_set_version: "v1"

    # Rolling window size used by all time-series feature primitives.
    # Features produced per instrument:
    #   price_mean_{N}    — rolling mean of trade price
    #   price_std_{N}     — rolling standard deviation of trade price
    #   price_zscore_{N}  — rolling z-score of trade price
    #   volume_mean_{N}   — rolling mean of trade size
    lookback_bars: 200

  storage:
    # Default storage root (overridable via --storage-root flag).
    root: data
