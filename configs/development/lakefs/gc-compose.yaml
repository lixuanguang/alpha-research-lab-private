# Disposable synthetic retention acceptance only; no external data or deployment.
name: alpha-lakefs-gc
services:
  initialize:
    image: treeverse/lakefs:1.86.0@sha256:fb7a0d90f77e3f893e8b8c6f3be131c090f6f0160c2d6c7784c4378cf7e66ea1
    user: "0:0"
    entrypoint: ["chown", "100:101", "/data"]
    volumes:
      - metadata:/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_LOCAL_ACCESS_KEY:?private local access key required}
      MINIO_ROOT_PASSWORD: ${S3_LOCAL_SECRET_KEY:?private local secret required}
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30
  bucket:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - 'mc alias set fixture http://minio:9000 "$$S3_ACCESS" "$$S3_SECRET" >/dev/null && mc mb --ignore-existing fixture/research'
    environment:
      S3_ACCESS: ${S3_LOCAL_ACCESS_KEY}
      S3_SECRET: ${S3_LOCAL_SECRET_KEY}
  lakefs:
    image: treeverse/lakefs:1.86.0@sha256:fb7a0d90f77e3f893e8b8c6f3be131c090f6f0160c2d6c7784c4378cf7e66ea1
    command: ["run"]
    depends_on:
      initialize:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18002:8000"
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_DATABASE_LOCAL_PATH: /data/metadata
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${S3_LOCAL_ACCESS_KEY}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${S3_LOCAL_SECRET_KEY}
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_LOCAL_ENCRYPTION_KEY:?private encryption key required}
      LAKEFS_STATS_ENABLED: "false"
      LAKEFS_LOGGING_LEVEL: WARN
    volumes:
      - metadata:/data
  collector:
    profiles: ["gc"]
    image: apache/spark:4.0.1@sha256:acfe7e06e95dd13aa32ee03c464766900d52fba15f58e421f8e1213ec041bb94
    user: "0:0"
    entrypoint: ["/opt/spark/bin/spark-submit"]
    volumes:
      - ${LAKEFS_GC_FILES:?private collector properties and pinned jars required}:/acceptance:ro
    command:
      - --master
      - local[1]
      - --class
      - io.treeverse.gc.GarbageCollection
      - --properties-file
      - /acceptance/spark.properties
      - --jars
      - /acceptance/hadoop-aws-3.4.1.jar,/acceptance/bundle-2.24.6.jar,/acceptance/aws-java-sdk-bundle-1.12.797.jar
      - /acceptance/lakefs-spark-client_2.13-assembly-0.22.0.jar
      - ${LAKEFS_GC_REPOSITORY:?explicit disposable repository required}
      - us-east-1
volumes:
  metadata:
  objects:
