[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "alpha-research-lab"
version = "0.1.0"
description = "Institutional multi-asset quantitative research platform"
readme = "docs/README.md"
requires-python = "==3.14.*"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "clearml==2.1.12",
    "exchange-calendars==4.13.2",
    "msgspec==0.21.1",
    "pandas==3.0.5",
    "pandera[pandas]==0.33.1",
    "pydantic==2.13.5",
    "QuantLib==1.43",
    "websockets==16.0",
]

[project.scripts]
alpha-collect = "applications.collect:main"
alpha-acquire = "applications.acquire:main"
alpha-dataset = "applications.publish_dataset:main"
alpha-inspect-fixture = "applications.inspect_fixture:main"

[dependency-groups]
dev = [
    "alpha-research-governance==0.1.0",
    "bandit[toml]==1.9.4",
    "hatchling==1.32.0",
    "hypothesis==6.167.1",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pre-commit-hooks==6.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.uv]
required-version = "==0.12.7"
default-groups = ["dev"]
constraint-dependencies = ["numpy==2.4.6"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
    { file = "src/**/py.typed" },
    { file = "docs/README.md" },
]

[tool.uv.sources]
alpha-research-governance = { path = "tools/governance", editable = false }

[tool.hatch.build.targets.sdist.force-include]
"tools/typing" = "tools/typing"

[tool.hatch.build.targets.wheel]
packages = ["src/applications", "src/configuration", "src/financial_units", "src/market_data", "src/reference_data", "src/research", "src/runtime", "src/serialization", "src/telemetry"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "tools/governance/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF", "D", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["applications", "configuration", "financial_units", "market_data", "reference_data", "research", "runtime", "serialization", "telemetry", "alpha_research_governance"]

[tool.ruff.lint.isort.import-heading]
standard-library = "standard library imports"
third-party = "third party library imports"
first-party = "project library imports"
local-folder = "project library imports"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_expr = true
packages = ["applications", "configuration", "financial_units", "market_data", "reference_data", "research", "runtime", "serialization", "telemetry", "alpha_research_governance"]
mypy_path = ["src", "tools/governance/src", "tools/typing/stubs"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-config --strict-markers -m "not integration and not performance"'
filterwarnings = ["error"]
markers = [
    "integration: slower tests that exercise external command or tool integration",
    "performance: non-blocking wall-clock checks run only in the dedicated performance lane",
]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
