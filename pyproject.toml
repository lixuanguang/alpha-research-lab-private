# PEP 517 build configuration used by pip/build backends.
[build-system]
# Build-time dependencies required to package/install this project.
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
# Setuptools backend implementation for PEP 517 builds.
build-backend = "setuptools.build_meta"

# PEP 621 project metadata.
[project]
# Distribution name published/installed via pip.
name = "alpha-research-lab"
# Version is resolved dynamically from Git tags via setuptools_scm.
dynamic = ["version"]
# Short description shown on package index metadata.
description = "Institutional-grade alpha research platform for prediction markets"
# Minimum supported runtime Python version.
requires-python = ">=3.11"
# Repository/package licensing marker.
license = {text = "Proprietary"}
# Human/organization attribution for the package.
authors = [{name = "Alpha Research Lab"}]
# Long-form project description source file.
readme = "README.md"

# Runtime dependencies needed by the core platform.
dependencies = [
    # Unified prediction-market exchange client.
    "pmxt>=2.18.0",
    # Validation and typed model framework.
    "pydantic>=2.0",
    # Settings management on top of pydantic.
    "pydantic-settings>=2.0",
    # Parquet/Arrow read-write and columnar interop.
    "pyarrow>=14.0",
    # Embedded analytical database for local research queries.
    "duckdb>=0.9",
    # YAML config parsing.
    "pyyaml>=6.0",
    # CLI framework for app entrypoints.
    "click>=8.0",
    # Structured logging primitives.
    "structlog>=23.0",
    # Optional .env loading for local secrets/config.
    "python-dotenv>=1.0",
]

# Optional dependency groups installed via extras, e.g. `.[dev]`.
[project.optional-dependencies]
# Tooling required for local development, CI, and tests.
dev = [
    # Test runner.
    "pytest>=7.0",
    # Coverage reporting plugin for pytest.
    "pytest-cov>=4.0",
    # Mock utilities integrated with pytest.
    "pytest-mock>=3.10",
    # Unified linter/formatter.
    "ruff>=0.1",
    # Static type checker.
    "mypy>=1.5",
    # Git hook manager.
    "pre-commit>=3.0",
    # Type stubs for PyYAML.
    "types-PyYAML",
    # Type stubs for python-dateutil.
    "types-python-dateutil",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
# Discover importable packages under libs/core for editable installs.
where = ["libs/core"]

[tool.setuptools_scm]
# Use nearest Git tag as the authoritative version source.
version_scheme = "guess-next-dev"
# Append local build metadata (e.g. commit hash/date) for traceability.
local_scheme = "node-and-date"
# Fallback when Git metadata is unavailable (e.g. source export).
fallback_version = "0.0.0+unknown"

# Ruff configuration (lint + format).
[tool.ruff]
# Enforce Python 3.11 syntax/runtime assumptions.
target-version = "py311"
# Max line width used by formatter/linter rules.
line-length = 100
# Source roots Ruff should scan for checks/import sorting.
src = ["libs/core", "apps", "tests"]

[tool.ruff.lint]
# Rule families: pycodestyle/pyflakes/imports/warnings/pyupgrade/ruff-specific.
select = ["E", "F", "I", "W", "UP", "RUF"]

[tool.ruff.format]
# Use double quotes when formatting strings.
quote-style = "double"
# Use spaces (not tabs) for indentation.
indent-style = "space"

# Mypy static typing configuration.
[tool.mypy]
# Type-check using Python 3.11 semantics.
python_version = "3.11"
# Enable strict mode baseline (maximizes type safety).
strict = true
# Warn when Any leaks through return types.
warn_return_any = true
# Warn about stale/unused mypy config entries.
warn_unused_configs = true
# Require explicit type annotations on all function defs.
disallow_untyped_defs = true
# Primary package set checked by mypy.
packages = ["alpha_core"]
# Add libs/core to module search path for local package layout.
mypy_path = "libs/core"

# Pytest configuration.
[tool.pytest.ini_options]
# Directory roots where pytest discovers tests.
testpaths = ["tests"]
# Default test flags: verbose output + short tracebacks.
addopts = "-v --tb=short"
# Add libs/core so tests can import alpha_core without extra env setup.
pythonpath = ["libs/core"]

# Coverage.py runtime collection settings.
[tool.coverage.run]
# Restrict measured coverage to alpha_core package.
source = ["alpha_core"]

# Coverage.py report thresholds/output behavior.
[tool.coverage.report]
# Minimum acceptable total coverage percent.
fail_under = 85
# Show missing line info in reports.
show_missing = true
