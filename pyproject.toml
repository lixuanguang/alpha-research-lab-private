[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "alpha-research-lab"
version = "0.1.0"
description = "Institutional multi-asset quantitative research platform"
readme = "docs/README.md"
requires-python = "==3.12.*"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alpha-research-governance==0.1.0",
    "exchange-calendars==4.13.2",
    "pydantic==2.13.5",
    "QuantLib==1.43",
]

[project.scripts]
alpha-research-ci = "alpha_research.ci_policy:main"

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "hatchling==1.32.0",
    "hypothesis==6.167.1",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pre-commit-hooks==6.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.uv]
required-version = "==0.12.7"
default-groups = ["dev"]
constraint-dependencies = ["numpy==2.4.6"]

[tool.uv.sources]
alpha-research-governance = { path = "tools/governance", editable = false }

[tool.hatch.build.targets.sdist.force-include]
"tools/typing" = "tools/typing"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_research"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools/governance/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["alpha_research", "alpha_research_governance"]

[tool.ruff.lint.isort.import-heading]
standard-library = "standard library imports"
third-party = "third party library imports"
first-party = "project library imports"
local-folder = "project library imports"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_unimported = true
packages = ["alpha_research", "alpha_research_governance"]
mypy_path = ["src", "tools/governance/src", "tools/typing/stubs"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["alpha_research.*", "alpha_research_governance.*"]
disallow_any_decorated = true

[[tool.mypy.overrides]]
module = [
    "alpha_research.financial_units.conventions",
    "alpha_research_governance._models",
    "alpha_research_governance.change_risk.models",
    "alpha_research_governance.ci_policy.policy",
    "alpha_research_governance.engineering_standards.python_typing",
    "alpha_research_governance.operating_model",
    "test_python_typing",
]
disallow_any_expr = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-config --strict-markers -m "not integration and not performance"'
filterwarnings = ["error"]
markers = [
    "integration: slower tests that exercise external command or tool integration",
    "performance: non-blocking wall-clock checks run only in the dedicated performance lane",
]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
