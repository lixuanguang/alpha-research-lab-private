[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "alpha-research-lab"
version = "0.1.0"
description = "Institutional multi-asset quantitative research platform"
readme = "docs/README.md"
requires-python = "==3.12.*"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "bandit[toml]==1.8.0",
    "hatchling==1.27.0",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
    "pre-commit-hooks==5.0.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
]

[tool.uv]
required-version = "==0.12.5"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_research"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alpha_research"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
