[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "alpha-research-governance"
version = "0.1.0"
description = "Repository-local governance validation tooling"
requires-python = "==3.12.*"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic==2.13.5",
]

[project.scripts]
alpha-governance-architecture = "alpha_research_governance.architecture_governance:main"
alpha-governance-artifacts = "alpha_research_governance.artifact_supply_chain:main"
alpha-governance-ci = "alpha_research_governance.ci_policy:main"
alpha-governance-dependencies = "alpha_research_governance.dependency_admission:main"
alpha-governance-engineering-standards = "alpha_research_governance.engineering_standards:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_research_governance"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/py.typed" },
]
